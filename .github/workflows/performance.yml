name: Performance Budgets

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bundle-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:ts-only
      - run: npm run perf:budgets
        env:
          MAX_CHUNK_KB: "260"
          MAX_TOTAL_JS_KB: "5200"
          MAX_TOTAL_GZIP_KB: "1600"

  lighthouse:
    runs-on: ubuntu-latest
    needs: bundle-budgets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:ts-only
      - run: npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
